name: Sadew Mini Bot Run

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Start SADEW-MINI-MD
      env:
        G_TOKEN: ${{ secrets.G_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.G_TOKEN }}
        GH_TOKEN: ${{ secrets.G_TOKEN }}
        GITHUB_USERNAME: ${{ github.actor }}          # 👈 GitHub එකෙන්ම ඔටෝ නම ගන්නවා
        OWNER_NAME: ${{ github.repository_owner }}    # 👈 ඔටෝම අයිතිකාරයාගේ නම ගන්නවා
        REPO_NAME: ${{ github.event.repository.name }} # 👈 රෙපෝ එකේ නම ඔටෝ ගන්නවා
      run: node index.js
