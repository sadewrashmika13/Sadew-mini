name: Sadew Mini Bot Run

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Start SADEW-MINI-MD
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 👈 මෙන්න මේ කෑල්ලෙන් Token එක බොට් එකට දෙනවා!
      run: node index.js
